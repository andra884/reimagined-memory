name: Bundle integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check bundle integrity
        run: python evals/check_bundle.py
